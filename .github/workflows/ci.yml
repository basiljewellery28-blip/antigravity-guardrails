name: Antigravity Skills CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-skills:
    name: Validate Skills Schema & Security
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SKILL.md Frontmatter Metadata (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -File ./scripts/validate_skills.ps1

      - name: Validate SKILL.md Frontmatter Metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./scripts/validate_skills.sh

      - name: Run Secret Sentinel Scan
        shell: pwsh
        run: |
          pwsh -File ./skills/security-secret-sentinel/scripts/scan_secrets.ps1

      - name: Run OWASP SAST Pattern Scan
        shell: pwsh
        run: |
          pwsh -File ./skills/owasp-secure-coding/scripts/verify_sast_patterns.ps1

      - name: Test Global Installer (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -IncludeSuites

      - name: Test Global Installer (Bash)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./install.sh ./install-suite.sh ./scripts/*.sh
          ./install.sh --include-suites

